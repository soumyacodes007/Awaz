<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wireframe SVG illustrations</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#252725;font:16px/1.5 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:36px 22px 54px}h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:550;margin:0 0 6px}p{color:#7b7e7a;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:15px;transition:transform .45s ease,box-shadow .45s ease}figure:hover img{transform:translateY(-7px);box-shadow:0 17px 28px #23302614}figcaption{padding:12px 2px;text-transform:capitalize;color:#626661}@media(prefers-reduced-motion:reduce){img{transition:none}}</style></head>
<body><main><h1>Geometric wireframe illustrations</h1><p>Four original SVGs inspired by the thin-line visual language in your reference. Hover over each card.</p><div class="grid"><figure><img src="wireframe-orbit-coral.svg" alt="orbit coral"><figcaption>Orbit Coral</figcaption></figure>
<figure><img src="wireframe-prism-ocean.svg" alt="prism ocean"><figcaption>Prism Ocean</figcaption></figure>
<figure><img src="wireframe-signal-violet.svg" alt="signal violet"><figcaption>Signal Violet</figcaption></figure>
<figure><img src="wireframe-cascade-mint.svg" alt="cascade mint"><figcaption>Cascade Mint</figcaption></figure></div></main></body></html>
