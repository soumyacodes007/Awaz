# Run the published dograh-api image with this repo's api/ source mounted in.
#
# The image's api/ code matches this repo's committed api/ apart from our own
# changes (checked 2026-10-05 by diffing /app/api against `git archive HEAD api`),
# so mounting the whole directory only adds our work:
#
#   api/utils/tunnel.py
#     Caches the cloudflared lookup (including the "no tunnel" outcome) and
#     lowers the probe timeout, so /health doesn't stall ~6s.
#   api/services/pipecat/service_factory.py
#     OpenRouter extra_body: provider order plus reasoning off for qwen/ models.
#   api/services/configuration/registry.py
#     OpenRouter/Sarvam api_key defaults from OPENROUTER_API_KEY / SARVAM_API_KEY.
#   Logs API (api/routes/logs.py and friends, migration 64d2c0879a10).
#     The container runs `alembic upgrade head` on start, so restarting the api
#     service applies new migrations.
#
# Python dependencies: the api runs a thin local image (deploy/local/api.Dockerfile)
# that installs api/requirements.txt on top of the published one, so pins such as
# google-genai 2.28 persist. restart-dograh.sh rebuilds it (cached when unchanged).
#
# The old Next.js ui/ is gone; the Awaz frontend in web/ runs with `npm run dev`
# on :3000. The upstream ui service is parked behind a profile so it never starts.
#
# Remove this file to run the stock images.
services:
  api:
    image: awaz-api:local
    build:
      context: .
      dockerfile: deploy/local/api.Dockerfile
    volumes:
      - ./api:/app/api
      # Keep the image's installed TS validator dependencies; the repo has none.
      - /app/api/mcp_server/ts_validator/node_modules
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      SARVAM_API_KEY: "${SARVAM_API_KEY:-}"

  ui:
    profiles: ["legacy-ui"]
